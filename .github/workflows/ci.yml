name: CI
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
      - run: pnpm install
      - run: pnpm typecheck
      - run: pnpm test
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
